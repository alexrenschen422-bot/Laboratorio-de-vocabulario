<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laboratorio de vocabulario</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: calm study room. Left sidebar on wide screens, bottom tab bar on phones, one activity card at a time. */
:root{
 --bg:#EEF4F2;--surface:#FFFFFF;--surface2:#F5F9F8;--ink:#1F3A40;--mut:#5F7B80;--line:#D9E6E3;
 --pri:#2A9183;--priInk:#FFFFFF;--sun:#F2B33D;--coral:#EE8B6A;
 --ok:#23804F;--okbg:#DFF3E6;--bad:#BF4038;--badbg:#FBE4E0;--alm:#A86A10;--almbg:#FCF0D6;
 --tint:color-mix(in srgb,var(--pri) 9%,var(--surface));--tint2:color-mix(in srgb,var(--pri) 18%,var(--surface));
 --f-disp:"Baloo 2","Trebuchet MS",system-ui,sans-serif;--f-body:"Nunito","Segoe UI",system-ui,sans-serif;
 --fs:1;--r:20px;--sh:0 1px 2px #1F3A400D,0 6px 18px #1F3A400A;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#132429;--surface:#1A3036;--surface2:#1F383F;--ink:#E4F1EE;--mut:#9DBBBE;--line:#2D4B52;--pri:#4FC2B1;--priInk:#0E2226;--sun:#F5C35B;--coral:#F29C7F;--ok:#62D193;--okbg:#173D2A;--bad:#FF8C80;--badbg:#45211E;--alm:#F2C063;--almbg:#3F3217;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#132429;--surface:#1A3036;--surface2:#1F383F;--ink:#E4F1EE;--mut:#9DBBBE;--line:#2D4B52;--pri:#4FC2B1;--priInk:#0E2226;--sun:#F5C35B;--coral:#F29C7F;--ok:#62D193;--okbg:#173D2A;--bad:#FF8C80;--badbg:#45211E;--alm:#F2C063;--almbg:#3F3217;--sh:none;color-scheme:dark}
body[data-pal="cielo"]{--pri:#3E7CCB}body[data-pal="lavanda"]{--pri:#7A67C2}body[data-pal="melocoton"]{--pri:#D9714E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body[data-pal="cielo"]{--pri:#7FB2F0}:root:not([data-theme="light"]) body[data-pal="lavanda"]{--pri:#B3A5F0}:root:not([data-theme="light"]) body[data-pal="melocoton"]{--pri:#F2A07F}}
:root[data-theme="dark"] body[data-pal="cielo"]{--pri:#7FB2F0}:root[data-theme="dark"] body[data-pal="lavanda"]{--pri:#B3A5F0}:root[data-theme="dark"] body[data-pal="melocoton"]{--pri:#F2A07F}
html{font-size:calc(16px * var(--fs))}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--f-disp);line-height:1.15;text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
.en,.enx{color:var(--mut);font-weight:600;font-size:.86em}
body.noen .en,body.noen .ten{display:none}
.entog{padding:6px 10px;font-weight:800}.entog .eni{font-size:1.05rem}.entog[aria-pressed="true"]{background:var(--surface2);border-color:var(--pri);color:var(--pri)}.entog[aria-pressed="false"]{opacity:.8}
body.noen .btn small,body.noen .seg button small,body.noen .cta small{display:none}
/* ---------- app frame ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:18px 14px 16px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.brand b{font:700 1.2rem/1 var(--f-disp);display:block}.brand small{color:var(--mut);font-weight:700;font-size:.78rem}
.sessbtn{border:0;background:var(--pri);color:var(--priInk);border-radius:14px;padding:11px 12px;font-weight:800;cursor:pointer;text-align:left;margin:6px 0 2px}
.side nav{display:flex;flex-direction:column;gap:2px}
.ng{margin:8px 8px 3px;font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.nv{display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:12px;padding:6px 10px;cursor:pointer;font-weight:700;text-align:left;color:var(--ink)}
.nv:hover{background:var(--surface2)}
.nv[aria-current="page"]{background:var(--tint2);color:var(--ink)}
.nv .ni{width:24px;text-align:center;font-size:1.1rem}.nv .nt{flex:1}
.badge{min-width:22px;height:22px;border-radius:11px;background:var(--coral);color:#fff;font-size:.75rem;font-weight:800;display:inline-grid;place-items:center;padding:0 6px}
.badge[hidden]{display:none!important}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.sfrow{display:flex;gap:8px;align-items:center;justify-content:space-between}
.lvseg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface2);border-radius:12px;padding:3px}
.lvseg button{border:0;background:transparent;border-radius:9px;padding:5px 2px;font-size:.72rem;font-weight:800;cursor:pointer;line-height:1.1;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px}
.lvseg button span{font-size:1rem}
.lvseg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--sh)}
.mainw{min-width:0}
.mtop{display:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line);align-items:center;gap:8px;padding-block:6px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.mtop .brand{margin-right:auto}.mtop .brand b{font-size:1.05rem}
.lvpill{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:4px 10px;font-weight:800;font-size:.82rem;cursor:pointer}
.iconb{border:0;background:var(--surface2);border-radius:10px;width:38px;height:36px;cursor:pointer;font-size:1.1rem}
main{max-width:1140px;margin:0 auto;padding-block:22px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--surface);border-top:1px solid var(--line);padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));justify-content:space-around}
.bnav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:0;font-size:.7rem;font-weight:800;color:var(--mut);padding:4px 6px;border-radius:10px;cursor:pointer;position:relative;min-width:60px}
.bnav button span:first-child{font-size:1.35rem;line-height:1.2}
.bnav button[aria-current="page"]{color:var(--pri);background:var(--tint)}
.bnav .badge{position:absolute;top:0;right:8px;min-width:18px;height:18px;font-size:.65rem}
@media (max-width:979px){.app{grid-template-columns:minmax(0,1fr)}.side{display:none}.mtop{display:flex}.bnav{display:flex}main{padding-block:14px 96px}}
/* ---------- common controls ---------- */
.starbox{display:inline-flex;align-items:center;gap:5px;background:color-mix(in srgb,var(--sun) 20%,var(--surface));border-radius:999px;padding:4px 11px;font:800 .95rem var(--f-disp);font-variant-numeric:tabular-nums}
.starbox.pop{animation:pop .45s}@keyframes pop{40%{transform:scale(1.18)}}
.btn{border:1.5px solid var(--pri);background:var(--surface);color:var(--pri);border-radius:12px;padding:7px 13px 6px;font-weight:800;cursor:pointer;line-height:1.05;text-align:center;font-size:.95rem}
.btn small{display:block;font-size:.64rem;font-weight:700;opacity:.8;margin-top:1px}
.btn.pri{background:var(--pri);color:var(--priInk)}
.btn.ghost{border-color:transparent;background:var(--surface2);color:var(--ink)}
.btn:hover{filter:brightness(1.04)}.btn:active{transform:translateY(1px)}
.btn.huge{font-size:1.25rem;padding:14px 22px;border-radius:16px}
.btn.pulse{animation:pulse 1.2s infinite}@keyframes pulse{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--pri) 25%,transparent)}}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface2);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 11px;font-weight:800;font-size:.86rem;cursor:pointer;line-height:1.1;color:var(--mut)}
.seg button small{display:block;font-size:.66rem;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--sh)}
.tog{border:0;background:transparent;cursor:pointer;padding:4px;display:inline-flex;align-items:center;gap:8px;font-weight:800}
.tog .sw{width:42px;height:24px;border-radius:24px;background:var(--line);position:relative;flex:none;transition:background .2s}
.tog .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:left .2s;box-shadow:0 1px 2px #0003}
.tog[aria-pressed="true"] .sw{background:var(--pri)}.tog[aria-pressed="true"] .sw::after{left:21px}
.tog small{display:block;font-size:.68rem;color:var(--mut);font-weight:700}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid var(--surface);outline:2px solid var(--line);cursor:pointer}
.swatch[aria-pressed="true"]{outline:3px solid var(--ink)}
.avbtn{font-size:1.4rem;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;width:44px;height:44px;cursor:pointer}
.avbtn[aria-pressed="true"]{border-color:var(--pri);background:var(--tint2)}
.opt{display:flex;flex-wrap:wrap;gap:6px}
.fld{width:100%;padding:8px 11px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--ink);font:700 1rem var(--f-body)}
select{padding:6px 9px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface2);color:var(--ink);font:700 .92rem var(--f-body)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
/* ---------- settings modal ---------- */
.modal{position:fixed;inset:0;z-index:60;background:#0F1E2299;display:flex;align-items:flex-start;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 12px 20px;overflow-y:auto}
.modal[hidden]{display:none}
.mbox{background:var(--surface);border-radius:24px;max-width:680px;width:100%;padding:18px 20px 22px;box-shadow:0 20px 60px #0004}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.mbox section{border-top:1px solid var(--line);padding-top:14px;margin-top:14px;display:flex;flex-direction:column;gap:12px}
.mbox h3{font-size:1.15rem}
.crow{display:flex;gap:14px;align-items:center;justify-content:space-between}.crow.col{flex-direction:column;align-items:stretch}
.crow b{font-weight:800}.crow p{margin:2px 0 0;color:var(--mut);font-size:.86rem;font-weight:600}
.lvcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.lvcard{border:1.5px solid var(--line);border-radius:16px;padding:10px 12px;background:var(--surface2);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:3px}
.lvcard[aria-pressed="true"]{border-color:var(--pri);background:var(--tint2)}
.lvcard b{font:700 1.05rem var(--f-disp)}.lvcard span{font-size:.84rem;color:var(--mut);font-weight:600}
/* ---------- home ---------- */
.hello{display:flex;gap:20px;align-items:center;background:var(--surface);border-radius:28px;padding:24px 26px;box-shadow:var(--sh)}
.hmain{flex:1;min-width:0}.hello h2{font-size:clamp(1.8rem,4vw,2.5rem)}
.hsub{margin:4px 0 16px;color:var(--mut);font-weight:700}
.howl{flex:none}@media(max-width:640px){.howl{display:none}.hello{padding:18px}}
.ctas{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.cta{border:1.5px solid var(--line);background:var(--surface2);border-radius:20px;padding:14px 16px;cursor:pointer;text-align:left;display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center}
.cta span{grid-row:1/3;font-size:2rem}.cta b{font:700 1.15rem var(--f-disp)}.cta small{color:var(--mut);font-weight:700;font-size:.82rem}
.cta.pri{background:var(--pri);border-color:var(--pri);color:var(--priInk)}.cta.pri small{color:var(--priInk);opacity:.85}
.sec{font-size:1.25rem;margin:26px 2px 10px}
.ptitle{font-size:1.7rem;margin:4px 2px 14px}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.ucard{border:0;background:var(--surface);border-radius:20px;padding:16px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;box-shadow:var(--sh)}
.ucard:hover{outline:2px solid var(--tint2)}
.ucard .ui{font-size:2rem}.ucard b{font:700 1.2rem var(--f-disp)}.ucard small{color:var(--mut);font-weight:700;font-size:.8rem}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pcard{border:0;background:var(--surface);border-radius:18px;padding:14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;box-shadow:var(--sh)}
.pcard span{font-size:1.6rem}.pcard b{font:700 1.05rem var(--f-disp)}.pcard small{color:var(--mut);font-weight:700;font-size:.78rem}
/* ---------- view header + activity tabs ---------- */
.vhead{display:flex;gap:14px;align-items:center;margin:0 2px 14px}
.vhead .vi{font-size:2.4rem;width:64px;height:64px;display:grid;place-items:center;background:var(--surface);border-radius:20px;box-shadow:var(--sh);flex:none}
.vhead h2{font-size:1.9rem}.vhead p{margin:2px 0 0;color:var(--mut);font-weight:700;font-size:.9rem}
.acts{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:thin}
.acts button{flex:none;border:0;background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:800;cursor:pointer;display:flex;gap:6px;align-items:center;box-shadow:var(--sh);color:var(--ink)}
.acts button[aria-selected="true"]{background:var(--pri);color:var(--priInk)}
/* ---------- activity card ---------- */
.blk{background:var(--surface);border-radius:24px;padding:18px 20px 16px;box-shadow:var(--sh)}
.bh{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between}
.bt{display:flex;gap:12px;align-items:center;min-width:0}
.bi{font-size:1.7rem;width:48px;height:48px;display:grid;place-items:center;background:var(--tint);border-radius:14px;flex:none}
.bt h3{font-size:1.4rem}.ten{margin:0;color:var(--mut);font-weight:700;font-size:.82rem}
.bact{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{font:800 1rem var(--f-disp);border-radius:999px;padding:5px 12px;font-variant-numeric:tabular-nums}
.pill.p100{background:var(--okbg);color:var(--ok)}.pill.p70{background:var(--almbg);color:var(--alm)}.pill.plow{background:var(--badbg);color:var(--bad)}
.tools{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:12px 0 0;padding:8px 10px;background:var(--surface2);border-radius:14px}
.tools label{font-weight:800;font-size:.9rem;display:inline-flex;gap:6px;align-items:center}
.sub{color:var(--mut);margin:10px 2px 2px;font-weight:600;max-width:78ch}
.fb{margin:12px 2px 0;font:700 1.1rem var(--f-disp)}.fb:empty{display:none}
.best{margin:2px 2px 0;color:var(--mut);font-size:.8rem;font-weight:700}.best:empty{display:none}
.bb{margin-top:12px}
.bb h4{font:700 1.12rem var(--f-disp);margin:18px 2px 8px}
.bank{margin:12px 0 0;background:var(--tint);border-radius:16px;padding:9px 11px}
.bkl{margin:0 0 6px;font-weight:800;font-size:.88rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-weight:800;font-size:.9rem;cursor:pointer}
.chip.used{opacity:.35;text-decoration:line-through}
/* ---------- answer boxes and feedback ---------- */
input.ans,textarea.ans{width:100%;padding:8px 11px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--ink);font:700 1rem var(--f-body)}
input.ans::placeholder,textarea.ans::placeholder{color:color-mix(in srgb,var(--mut) 70%,transparent);font-weight:600}
input.ans:focus,textarea:focus,button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:1px}
.ok{border-color:var(--ok)!important;background:var(--okbg)!important}
input.ans.ok{cursor:pointer}
.bad{border-color:var(--bad)!important;background:var(--badbg)!important}
.almost,.try{border-color:var(--alm)!important;background:var(--almbg)!important}
.try{border-style:dashed!important}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.ov input.shake{animation:shk2 .4s}@keyframes shk2{25%{transform:translate(calc(-50% - 5px),-50%)}50%{transform:translate(calc(-50% + 5px),-50%)}75%{transform:translate(calc(-50% - 3px),-50%)}}
.hint{display:block;margin:4px 2px 0;font-size:.86rem;font-weight:700;color:var(--alm);background:var(--almbg);border-radius:10px;padding:3px 9px;width:fit-content;max-width:100%}
.hint.ans{color:var(--ok);background:var(--okbg)}
.hint.ovh{position:absolute;transform:translateX(-50%);z-index:3;font-size:clamp(9px,1.15cqw,13px);white-space:nowrap;pointer-events:auto;box-shadow:0 2px 6px #1F3A4022;margin:0}
.hint .spk{font-size:.95em;padding:0 2px}
.qs{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px 18px}
.q{display:flex;flex-direction:column;gap:5px;min-width:0}.q p{margin:0;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.card{background:var(--surface2);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;min-width:0}
.card svg{width:84px;height:84px}
.card .d{font-size:.86rem;font-weight:700;line-height:1.25;min-height:2.5em}
.card .big{font-size:2.6rem;line-height:1}
.cat{margin:12px 0}.cat b{display:block;margin-bottom:5px}
.four{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px}
.model{color:var(--pri);font-weight:700;font-size:.9rem;margin:2px 0 0}
textarea.ans{resize:vertical;min-height:3.4em}
.desc{margin:14px 0 0;background:var(--surface2);border-radius:16px;padding:10px 12px}
.desc .dh{margin:0 0 6px}.dfb{margin:4px 2px 0;font-weight:700;font-size:.88rem;color:var(--mut)}.dfb:empty{display:none}
/* ---------- diagrams ---------- */
.dg{margin:12px 0 4px}
.dgw{position:relative;width:100%;container-type:inline-size;border-radius:18px;overflow:hidden;background:#F7FBFA}
.dgs{display:block;width:100%;height:100%}
.pin circle{fill:var(--pri);stroke:#fff;stroke-width:3}
.pin text{fill:#fff;font:800 10px var(--f-body);pointer-events:none}
.pin.ok circle{fill:#23804F}.pin.bad circle{fill:#BF4038}.pin.almost circle,.pin.try circle{fill:#C98A1E}
.lead{stroke:#1F3A40;opacity:.5}
.ov{position:absolute;inset:0;pointer-events:none}
.ov input.ans{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;font-size:clamp(9px,1.25cqw,15px);padding:0 .45em;border-radius:.6em;border-width:2px;background:#FFFFFFF2;color:#1F3A40;border-color:#A9C6C1;box-shadow:0 2px 6px #1F3A4022}
.ov input.ans::placeholder{color:#7C9599}
.dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 12px;margin-top:12px}
.dl.wide3{grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr))}
.dli{display:flex;gap:8px;align-items:flex-start;min-width:0}
.dli .num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--pri);color:var(--priInk);display:grid;place-items:center;font-weight:800;font-size:.9rem;margin-top:5px}
.dlf{flex:1;min-width:0;display:flex;flex-direction:column}
.dlf small{margin:2px 0 0 4px}.dlab{font-size:.82rem;margin:0 0 2px 4px}
.dlrow{display:flex;gap:6px;min-width:0}.dlrow input{min-width:0}
.pan{overflow:auto;border-radius:18px;max-height:min(78vh,820px);cursor:grab;overscroll-behavior:contain}
.pan.drag{cursor:grabbing}.pan .dgw{border-radius:0;max-width:none}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}

.drtask{background:var(--tint);border-radius:16px;padding:10px 14px}.drtask p{margin:4px 0}.drtask ul{margin:4px 0 0;padding-left:20px;font-weight:800;font-size:1.05rem}

.drh{font-weight:800;margin:12px 0 5px}.drcols{display:flex;flex-wrap:wrap;gap:7px}

.drks{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.drk{border:1.5px solid var(--line);background:#FFFFFF;border-radius:14px;padding:3px;cursor:pointer;line-height:0}
.drk[aria-pressed="true"]{border-color:var(--pri);background:#E6F4F1;box-shadow:0 0 0 2px var(--pri)}.drk svg{width:100%;height:auto}
.drsel{display:flex;align-items:center;gap:8px;min-height:44px;margin-top:8px}

/* core.js: settings, memory (spaced repetition), answer checking, hints, blocks, word bank, diagrams, stars */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const store={get(k){try{return localStorage.getItem('vl5-'+k)}catch(e){return null}},set(k,v){try{localStorage.setItem('vl5-'+k,v)}catch(e){}}};
const jget=(k,d)=>{try{const v=store.get(k);return v?JSON.parse(v):d}catch(e){return d}};
const S=Object.assign({lvl:1,bank:false,dev:'auto',strict:false,enMode:'auto',instant:true,art:false,pal:'menta',fs:1,av:'🧒',name:'',color:false,nolisten:false},jget('cfg',{}));
if(S.dev==null)S.dev='auto';if(S.en===false&&!jget('cfg',{}).enMode)S.enMode='off';
const saveS=()=>store.set('cfg',JSON.stringify(S));
const isPhone=()=>S.dev=='phone'||(S.dev=='auto'&&window.innerWidth<760);
const showEn=()=>S.enMode=='on'||(S.enMode=='auto'&&S.lvl==1);
const R=n=>Math.random()*n|0,pick=a=>a[R(a.length)],rr=(a,b)=>a+Math.random()*(b-a);
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=R(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ART=/^(el|la|los|las|un|una|unos|unas|mi|mis|su|sus|tu|tus) /;
const DEF=/^(el|la|los|las) /;
const base=s=>(s||'').toLowerCase().trim().replace(/[.,;:!¡?¿"()]/g,'').replace(/\s+/g,' ');
const deacc=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'');
function norm(s,strict=S.strict){s=base(s);if(!strict)s=deacc(s);return s.replace(ART,'')}
const normKeep=s=>{s=base(s);if(!S.strict)s=deacc(s);return s};
const eq=(a,b)=>a===b||a+'s'===b||b+'s'===a||a+'es'===b||b+'es'===a;
const alts=a=>String(a).split('|');
const first=a=>alts(a)[0];
function matchArt(v,ans){const nv=normKeep(v);for(const x of alts(ans)){const c=entry(x);const forms=c?alts(c.es).filter(f=>DEF.test(base(f))):[];
 if(forms.length){if(forms.some(f=>eq(normKeep(f),nv)))return true;if(/^(mi|mis|su|sus|tu|tus) /.test(nv)&&eq(norm(x),norm(v)))return true}else if(eq(norm(x),norm(v)))return true}return false}
const match=(v,ans)=>{const n=norm(v);if(!n)return false;if(S.art)return matchArt(v,ans);return alts(ans).some(x=>eq(norm(x),n))};
const almost=(v,ans)=>S.strict&&!match(v,ans)&&alts(ans).some(x=>eq(norm(x,false),norm(v,false)));
const LV=['','Básico','Avanzado','Más vocabulario'],LVEN=['','Basic','Advanced','More vocabulary'];

/* ---------- vocabulary index ---------- */
let ALL=[],IDX=new Map();
function buildIndex(){IDX=new Map();ALL.forEach(c=>alts(c.es).forEach(x=>{const k=norm(x,false);if(!IDX.has(k))IDX.set(k,[]);IDX.get(k).push(c)}))}
function entry(ans,unit){for(const x of alts(ans)){const l=IDX.get(norm(x,false));if(l){return l.find(c=>!unit||c.u==unit)||l[0]}}return null}
function lvOf(ans,unit){for(const x of alts(ans)){const l=IDX.get(norm(x,false));if(l){const c=l.find(c=>c.u==unit);if(c)return c.lvl}}for(const x of alts(ans)){const l=IDX.get(norm(x,false));if(l)return Math.min(...l.map(c=>c.lvl))}return 3}
const enOf=(ans,unit)=>{const c=entry(ans,unit);return c?c.en:''};
/* the answer written with its article, e.g. "farmacia" -> "la farmacia" */
function artForm(a,unit){const w=first(a),c=entry(w,unit);if(!c)return w;const f=alts(c.es).find(x=>norm(x,false)==norm(w,false));return f||alts(c.es)[0]}
function pool(arr,lvF,need=0){const L=S.lvl;let p=arr.filter(x=>lvF(x)==L);if(p.length<need){const rest=shuf(arr.filter(x=>lvF(x)!=L)).sort((a,b)=>Math.abs(lvF(a)-L)-Math.abs(lvF(b)-L));p=p.concat(rest.slice(0,need-p.length))}return p}
const draw=(arr,lvF,n)=>shuf(pool(arr,lvF,n)).slice(0,n);

/* ---------- memory: spaced repetition ---------- */
const DAY=864e5,IV=[0,1,3,7,21,60];
let SRS=jget('srs',{});
const key=c=>c.u+'|'+c.es;
const saveSRS=()=>store.set('srs',JSON.stringify(SRS));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
function markDay(){const d=jget('days',[]);const t=today();if(!d.includes(t)){d.push(t);store.set('days',JSON.stringify(d.slice(-400)))}}
function streak(){const d=new Set(jget('days',[]));const k=x=>x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate();const x=new Date();if(!d.has(k(x)))x.setDate(x.getDate()-1);let n=0;while(d.has(k(x))){n++;x.setDate(x.getDate()-1)}return n}
/* res: true = right, false = wrong, 'hint' = right after a hint */
function srsUpd(c,res){if(!c)return;const k=key(c),now=Date.now();const r=SRS[k]||{b:0,d:0,r:0,w:0};
 if(res===true){r.r++;if(r.b==0||r.d<=now+DAY/2){r.b=Math.min(5,r.b+1);r.d=now+IV[r.b]*DAY}}
 else if(res==='hint'){r.b=Math.max(1,Math.min(r.b,2));r.d=now+DAY}
 else{r.w++;r.b=1;r.d=now}
 r.t=now;SRS[k]=r;saveSRS();markDay()}
const rec=c=>SRS[key(c)];
const isDue=c=>{const r=rec(c);return r&&r.b>0&&r.d<=Date.now()};
const dueList=()=>ALL.filter(isDue).sort((a,b)=>rec(a).d-rec(b).d);
const mastered=c=>{const r=rec(c);return r&&r.b>=3};
const getM=()=>{const m=jget('miss',[]);return [...new Set(m.concat(Object.entries(SRS).filter(([k,r])=>r.w>0&&r.b<3).map(([k])=>k)))]};
const setM=a=>store.set('miss',JSON.stringify([...new Set(a)].slice(-400)));
function miss(a,unit){const c=entry(a,unit);if(c)srsUpd(c,false)}
const addM=c=>srsUpd(c,false),delM=c=>{setM(jget('miss',[]).filter(k=>k!=key(c)));srsUpd(c,true)};

/* ---------- inputs ---------- */
function inp(a,o={}){return `<input type="text" class="ans${o.cls?' '+o.cls:''}" autocomplete="off" autocapitalize="off" spellcheck="false" data-a="${esc(a)}"${o.pin!=null?` data-pin="${o.pin}"`:''}${o.phen?` data-ph0="${esc(o.ph0)}" data-en="${esc(o.phen)}"`:''}${o.ph!=null?` placeholder="${esc(o.ph)}"`:''}${o.style?` style="${o.style}"`:''}${o.noinst?' data-noinst="1"':''} aria-label="${esc(o.label||'Respuesta (answer)')}">`}
function ginp(w,g,o={}){return `<input type="text" class="ans" autocomplete="off" autocapitalize="off" spellcheck="false" data-w="${esc(w)}" data-g="${g}"${o.ph?` placeholder="${esc(o.ph)}"`:''} aria-label="Palabra (word)">`}
const tEn=t=>t?`<span class="en">(${esc(t)})</span>`:'';
const enBtn=()=>`<button class="btn ghost entog" data-entog="1" aria-pressed="${showEn()}" title="Ayuda en inglés (English help)"><span class="eni">🇬🇧</span> <span class="enl">${showEn()?'Inglés: sí':'Inglés: no'}</span></button>`;

/* ---------- blocks ---------- */
const BL={},RUN={},LAST={};
function blockHTML(id){const b=BL[id];let o;try{o=b.render()}catch(e){console.error(id,e);o={t:'Error',en:'',body:`<p class="sub">${esc(e.message)}</p>`,noCheck:1}}
RUN[id]={aw:0,shown:false,o,unit:b.unit};
return `<section class="blk${o.wide?' wide':''}" id="b-${id}" data-b="${id}"><header class="bh"><div class="bt"><span class="bi" aria-hidden="true">${o.icon||'✏️'}</span><div class="btt"><h3>${o.t}</h3><p class="ten">${esc(o.en)}</p></div></div>
<div class="bact">${enBtn()}${/^(rev-|prog)/.test(id)?lisBtn():''}<span class="pill" id="sc-${id}" hidden></span>${o.noCheck?'':`<button class="btn pri" data-do="check" data-b="${id}">✓ Comprobar<small>Check</small></button><button class="btn ghost" data-do="show" data-b="${id}">Ver respuestas<small>Show answers</small></button>`}${o.noNew?'':`<button class="btn ghost" data-do="new" data-b="${id}" title="Nuevo (new)">↻ Nuevo<small>New</small></button>`}</div></header>
${o.tools?`<div class="tools">${o.tools}</div>`:''}${o.sub?`<p class="sub">${o.sub}${o.subEn?` ${tEn(o.subEn)}`:''}</p>`:''}<div class="bank" id="bk-${id}" hidden></div><div class="bb">${o.body}</div><p class="fb" id="fb-${id}" aria-live="polite"></p><p class="best" id="bs-${id}"></p></section>`}
function mount(id){const el=$('#b-'+id);if(!el)return;el.outerHTML=blockHTML(id);post(id)}
function post(id){bank(id);stats(id);const el=$('#b-'+id);if(el)requestAnimationFrame(()=>$$('.pan',el).forEach(p=>{if(p.id!='cmpan'){p.scrollLeft=(p.scrollWidth-p.clientWidth)/2;p.scrollTop=(p.scrollHeight-p.clientHeight)*.4}}));try{BL[id].after&&BL[id].after(el)}catch(e){console.error(id,e)}}
function stats(id){const b=store.get(`best-${id}-L${S.lvl}`),el=$('#bs-'+id);if(el)el.textContent=b?`Tu mejor resultado: ${b}%`:''}

/* ---------- word bank ---------- */
function bank(id){const r=$('#b-'+id),bk=$('#bk-'+id);if(!r||!bk)return;if(!S.bank||RUN[id].o.noBank){bk.hidden=true;return}
const words=[],groups={};
$$('.bb input[data-a]',r).forEach(el=>{if(!el.closest('[data-nobank]'))words.push(first(el.dataset.a))});
$$('.bb [data-w]',r).forEach(el=>{(groups[el.dataset.g]=groups[el.dataset.g]||{w:el.dataset.w,n:0}).n++});
Object.values(groups).forEach(g=>words.push(...shuf(alts(g.w)).slice(0,g.n)));
if(!words.length){bk.hidden=true;return}
bk.innerHTML=`<p class="bkl">Banco de palabras ${tEn('tap a box, then a word')}</p><div class="chips">${shuf(words).map(w=>`<button type="button" class="chip" data-chip="${esc(w)}">${esc(w)}</button>`).join('')}</div>`;bk.hidden=false;markChips(id)}
function markChips(id){const r=$('#b-'+id);if(!r)return;const vals=$$('.bb input.ans',r).map(i=>norm(i.value)).filter(Boolean);const cnt={};vals.forEach(v=>cnt[v]=(cnt[v]||0)+1);
$$('.chip',r).forEach(c=>{const k=norm(c.dataset.chip);if(cnt[k]){c.classList.add('used');cnt[k]--}else c.classList.remove('used')})}
function useChip(c){const r=c.closest('.blk'),id=r.dataset.b;let t=LAST[id];if(!t||!r.contains(t)||t.value.trim())t=$$('.bb input.ans',r).find(i=>!i.value.trim()&&!i.closest('[data-nobank]'));if(!t)return;
t.value=c.dataset.chip;t.classList.remove('ok','bad','almost','try');markChips(id);if(S.instant&&!t.dataset.noinst&&!BL[id].grade)checkOne(t,id);const nx=$$('.bb input.ans',r).find(i=>!i.value.trim());if(nx){nx.focus({preventScroll:true});LAST[id]=nx}}

/* ---------- hints ---------- */
const hintOf=a=>first(a).split(' ').map(w=>w[0]+' _'.repeat(Math.max(0,w.length-1))).join('   ');
function clearHint(el){if(el._hint){el._hint.remove();el._hint=null}}
function showHint(el,html,cls=''){clearHint(el);const h=document.createElement('span');h.className='hint '+cls;h.innerHTML=html;
 if(el.parentElement&&el.parentElement.classList.contains('ov')){h.classList.add('ovh');h.style.left=el.style.left;h.style.top=`calc(${el.style.top} + ${el.offsetHeight/2+3}px)`;el.parentElement.appendChild(h)}
 else el.insertAdjacentElement('afterend',h);el._hint=h}
function shake(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}

/* ---------- checking ---------- */
function setState(el,st,id){el.classList.remove('ok','bad','almost','try');if(st)el.classList.add(st);el.title=st=='almost'?'Casi: revisa la tilde (almost: check the accent)':st=='ok'?'Toca para escuchar (tap to listen)':'';
if(el.dataset.pin!=null){const p=$(`#pin-${id}-${el.dataset.pin}`);if(p){p.classList.remove('ok','bad','almost','try');if(st)p.classList.add(st)}}}
const enLater=()=>S.enMode=='on'||(S.enMode=='auto'&&S.lvl<=2);
/* instant check of one box: 1st mistake -> hint, 2nd mistake -> answer */
function checkOne(el,id){if(!el.value.trim()||!RUN[id])return;const unit=RUN[id].unit;let g;
 if(el.dataset.w){const nv=norm(el.value),grp=$$(`.bb [data-g="${CSS.escape(el.dataset.g)}"]`,$('#b-'+id)).filter(x=>x!==el&&x.classList.contains('ok')).map(x=>norm(x.value));g=alts(el.dataset.w).some(w=>eq(norm(w),nv))&&!grp.some(x=>eq(x,nv))}
 else g=match(el.value,el.dataset.a);
 el._t=(el._t||0)+1;clearHint(el);
 if(g){setState(el,'ok',id);if(el._t==1&&!el._star&&!RUN[id].shown){el._star=1;addStars(1);RUN[id].aw++}const c=el.dataset.w?entry(el.value,unit):entry(el.dataset.a,unit);if(c&&!el._srs&&!RUN[id].shown){srsUpd(c,el._t==1?true:'hint');el._srs=1}return}
 if(el.dataset.w){setState(el,'try',id);shake(el);showHint(el,'Esa palabra no vale o ya está escrita. '+tEn('not in this group, or already used'));return}
 const al=almost(el.value,el.dataset.a),en=enOf(el.dataset.a,unit);
 if(el._t==1){setState(el,'try',id);shake(el);showHint(el,`${al?'Casi: revisa la tilde · ':S.art&&alts(el.dataset.a).some(x=>eq(norm(x),norm(el.value)))?'Revisa el artículo (el / la) · ':'Pista: '}<b>${esc(hintOf(el.dataset.a))}</b>${enLater()&&en&&!showEn()?` <span class="enx">(${esc(en)})</span>`:''}`)}
 else{setState(el,'bad',id);const w=artForm(el.dataset.a,unit);showHint(el,`✔ <b>${esc(w)}</b> ${spk(w)}`,'ans');const c=entry(el.dataset.a,unit);if(c&&!el._srs&&!RUN[id].shown){srsUpd(c,false);el._srs=1}}}
function descOk(el){const v=deacc(base(el.value));const words=v.split(' ').filter(Boolean);const ws=el.dataset.desc.split(';').filter(Boolean);let hit=0;ws.forEach(w=>{if(alts(w).some(x=>{const n=deacc(base(x).replace(ART,''));return n&&(' '+v+' ').includes(' '+n)}))hit++});return{ok:words.length>=6&&hit>=3,hit,n:words.length}}

const ovl=(x1,y1,x2,y2,w,h)=>Math.max(0,w-Math.abs(x1-x2))*Math.max(0,h-Math.abs(y1-y2));
function placeLabels(marks,W,H,bw,bh,r){const out=[],ks=[r+bh/2+6,r*2.4+bh/2+6,r*3.8+bh/2+8,r*5.6+bh/2+10];const cand=[];
ks.forEach(k=>cand.push([0,k],[0,-k],[k+bw/2-bh/2,0],[-(k+bw/2-bh/2),0],[bw*.42,k],[-bw*.42,k],[bw*.42,-k],[-bw*.42,-k]));
marks.forEach((m,i)=>{let best=null,bs=1e12;const pf=m.prefs||(m.pref?[m.pref]:[]);const cs=pf.concat(cand);
 for(let ci=0;ci<cs.length;ci++){const [dx,dy]=cs[ci];const cx=m.x+dx,cy=m.y+dy;let s=ci<pf.length?ci*3:Math.hypot(dx,dy)+(pf.length?400:0);
  if(cx-bw/2<2||cx+bw/2>W-2||cy-bh/2<2||cy+bh/2>H-2)s+=1e9;
  for(const b of out)s+=ovl(cx,cy,b.cx,b.cy,bw+6,bh+6)*1e5;
  marks.forEach((p,j)=>{if(Math.abs(p.x-cx)<bw/2+r&&Math.abs(p.y-cy)<bh/2+r)s+=j==i?4e4:2e4});
  if(s<bs){bs=s;best={cx,cy}}}
 out.push(best)});return out}
const indefOf=w=>w.replace(/^el /,'un ').replace(/^la /,'una ').replace(/^los /,'unos ').replace(/^las /,'unas ');

let lead='',ov='';
if(!ph){const bw=o.bw||W*.135,bh=o.bh||Math.max(bw*.26,H*.032);const bx=placeLabels(o.marks,W,H,bw,bh,r);
 lead=bx.map((b,i)=>{const m=o.marks[i];if(m.nolead)return '';return `<line class="lead" x1="${m.x}" y1="${m.y}" x2="${b.cx}" y2="${b.cy}" stroke-width="${r/6}"/>`}).join('');
 ov=`<div class="ov">${o.marks.map((m,i)=>inp(m.a,{pin:i,ph:(i+1)+(en&&m.en?' · '+m.en:''),ph0:String(i+1),phen:m.en||'',label:`${i+1}`,style:`left:${(bx[i].cx/W*100).toFixed(2)}%;top:${(bx[i].cy/H*100).toFixed(2)}%;width:${(bw/W*100).toFixed(2)}%;height:${(bh/H*100).toFixed(2)}%`})).join('')}</div>`}

const svg=`<svg viewBox="0 0 ${W} ${H}" class="dgs" role="img" aria-label="${esc(o.label||'Diagrama')}">${o.art}<g class="leads">${lead}</g>${pins}${o.extra||''}</svg>`;

const phw=isPhone()&&W>700&&!o.pan?(W>1150?220:170):0;
const inner=`<div class="dgw${ph?' ph':''}" style="aspect-ratio:${W}/${H}${o.pan?`;width:${o.pan}px`:phw?`;width:${phw}%`:''}">${svg}${ov}</div>`;
let desc='';if(o.desc&&o.marks.length>=3){const ws=o.marks.map(m=>m.a);const ex=shuf(o.marks).slice(0,3).map(m=>indefOf(artForm(m.a,RUN[id]&&RUN[id].unit||null)));const model=`${o.desc} ${ex.slice(0,2).join(', ')} y ${ex[2]}.`;

/* which items can be seen (a closed coat hides the shirt, long trousers hide socks...) */
const CLOSED={abrigo:470,'chaquetón':400,gabardina:486,impermeable:440,chubasquero:378,'plumífero':360,cazadora:330,bata:486};
const OPENO=['americana','chaqueta','rebeca','chaleco','esmoquin','traje'];
const GBOT={falda:444,minifalda:388,'pantalón corto':412,bermudas:462,'pantalón':564,vaqueros:564,mallas:562,vestido:452,'camisón':530,'vestido de novia':566,pijama:564,'chándal':564,peto:564};
function visAnc(it,items){const g=G[it.k],ks=items.map(i=>i.k).filter(k=>k!=it.k);const cl=ks.find(k=>CLOSED[k]),op=ks.find(k=>OPENO.includes(k));const hem=cl?CLOSED[cl]:0;
 if(cl&&(g.cat=='top'||['rebeca','chaleco','cinturón','tirantes','corbata','pajarita','alfiler de corbata','americana','chaqueta'].includes(it.k)))return null;
 if(g.cat=='top'&&op)return[150,205];
 if(GBOT[it.k]){if(hem&&hem>=GBOT[it.k]-12)return null;if(hem&&hem+22>g.anc[1])return[g.anc[0]<150?110:190,Math.min(GBOT[it.k]-14,hem+26)]}
 if(it.k=='calcetines'&&ks.some(k=>['pantalón','vaqueros','mallas','chándal','pijama','traje','peto'].includes(k)))return null;
 if(it.k=='camiseta de tirantes'&&op)return[150,205];
 return g.anc}

function outfitScene(occ,n){const W=1000,H=700;const people=[];const sexes=n==2?shuf(['m','f']):[pick(['m','f'])];
const pos=n==2?[120,580]:[350];
sexes.forEach((sx,i)=>{const p=randPerson(sx);const ks=[...new Set(occ.make(sx))].filter(k=>G[k]);const items=ks.map(k=>({k,c:pickColor(k),p:pickPat(k)}));people.push({p,items,ox:pos[i],oy:28,sc:1})});
let art=sceneBG(occ.bg,W,H);const marks=[];
people.forEach(pp=>{art+=`<ellipse cx="${pp.ox+150}" cy="${pp.oy+590}" rx="100" ry="14" fill="#00000022"/><g transform="translate(${pp.ox} ${pp.oy})">${personSVG(pp.p,pp.items)}</g>`;
 pp.items.forEach(it=>{const g=G[it.k];const an=visAnc(it,pp.items);if(!an)return;const x=pp.ox+an[0],y=pp.oy+an[1];const L=an[0]<150;const tx=L?pp.ox+40-78:pp.ox+262+78;const pr=[];[0,1,-1,2,-2,3,-3,4,-4].forEach(k=>pr.push([tx-x,k*42]));marks.push({x,y,k:it.k,c:it.c,p:it.p,a:g.a,prefs:pr})})});
return{W,H,art,marks,people}}

function walkTo(x,y,cb){const w=$('#walker');if(!w){cb&&cb();return}w.style.transform=`translate(${x}px,${y}px)`;CM.wx=x;CM.wy=y;
const p=$('#cmpan');if(p){const svg=p.querySelector('svg');const sx=svg.clientWidth/CM.m.W;const tx=x*sx-p.clientWidth/2,ty=y*sx-p.clientHeight/2;p.scrollTo({left:tx,top:ty,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}
setTimeout(()=>cb&&cb(),matchMedia('(prefers-reduced-motion: reduce)').matches?0:650)}

 const cm=t.closest('[data-cmode]');if(cm){CM.mode=cm.dataset.cmode;mount('ciu-map');return}
 const cz=t.closest('[data-czoom]');if(cz){CM.zoom=+cz.dataset.czoom;mount('ciu-map');return}
 if(t.closest('[data-cskip]')){CM.find.i++;findHud();return}
 const wk=t.closest('[data-walk]');if(wk){walkStep(...wk.dataset.walk.split(',').map(Number));return}
 const b=t.closest('#cmpan .bld');if(!b)return;const pan=$('#cmpan');if(pan&&pan._dragged)return;
 const svg=pan.querySelector('svg'),pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const loc=pt.matrixTransform(svg.getScreenCTM().inverse());const n=placeName(b);
 if(CM.mode=='walk'){walkTo(loc.x,loc.y,()=>{$('#cmname').innerHTML=`${n.nm?esc(n.nm)+' → ':''}${esc(n.full)} ${tEn(n.en)} ${spk(n.a)}`;say((n.nm?n.nm+'. ':'')+n.full)});return}
 if(CM.mode=='find'){const F=CM.find,tg=F.targets[F.i];if(!tg)return;walkTo(loc.x,loc.y,()=>{const good=alts(tg.a).some(x=>norm(x)==norm(n.a))||norm(first(tg.a))==norm(b.dataset.k);
  if(good){F.ok+=F.tries==0?1:0;if(F.tries==0)addStars(1);toast(`✅ ¡Muy bien! Es ${esc(n.full)}. <span class="en">(Well done!)</span>`);F.i++;F.tries=0;findHud()}
  else{F.tries++;toast(`❌ Eso es ${esc(n.full)} ${showEn()?`<span class="en">(${esc(n.en)})</span>`:''}. ¡Sigue buscando! <span class="en">(Keep looking!)</span>`,2600)}})}});
function walkStep(di,dj){if(CM.wx==null){const w=$('#walker');if(!w)return;CM.wx=CM.m.W/2;CM.wy=CM.m.H*.62}const dx=(di-dj)*TW/2,dy=(di+dj)*TH/2;walkTo(CM.wx+dx*1.5,CM.wy+dy*1.5,()=>{let best=null,bd=1e9;CM.m.placed.forEach(p=>{if(!p.x)return;const d=Math.hypot(p.x-CM.wx,p.y-CM.wy);if(d<bd){bd=d;best=p}});const el=$('#cmname');if(el&&best&&bd<110){const c=entry(first(best.a),'Ciudad');const art=c&&c.es.match(/^(el|la|los|las) /);el.innerHTML=`${best.name?esc(best.name)+' → ':''}${art?art[1]+' ':''}${esc(first(best.a))} ${tEn(c?c.en:'')} ${spk(first(best.a))}`}else if(el)el.textContent=''})}

<section><h3>Pantalla y aspecto <span class="en">(screen and look)</span></h3>
<div class="crow col"><div><b>Respuestas</b><p>Ordenador: las casillas están en el dibujo. Móvil: lista debajo del dibujo. (Where the answer boxes go.)</p></div><div class="seg">${opt('dev','auto','Automático')}${opt('dev','pc','💻 En el dibujo')}${opt('dev','phone','📱 En lista')}</div></div>
<div class="crow col"><div><b>Colores</b></div><div class="opt">${[['menta','#2A9183','Menta'],['cielo','#3E7CCB','Cielo'],['lavanda','#7A67C2','Lavanda'],['melocoton','#D9714E','Melocotón']].map(([k,c,n])=>`<button class="swatch" style="background:${c}" data-set="pal" data-v="${k}" aria-pressed="${S.pal==k}" title="${n}" aria-label="${n}"></button>`).join('')}</div></div>
<div class="crow col"><div><b>Tamaño de letra</b></div><div class="seg">${[[.9,'A−'],[1,'A'],[1.12,'A+'],[1.25,'A++']].map(([v,t])=>opt('fs',v,t)).join('')}</div></div>
<div class="crow col"><div><b>Tu personaje en la ciudad</b></div><div class="opt">${['🧒','👧','👦','🧑','👩','👨','🐶','🐱','🦊','🐼'].map(a=>`<button class="avbtn" data-set="av" data-v="${a}" aria-pressed="${S.av==a}">${a}</button>`).join('')}</div></div>
<div class="crow col"><div><b>Tu nombre</b></div><input type="text" class="fld" id="pname" value="${esc(S.name)}" placeholder="Escribe tu nombre" autocomplete="off"></div></section></div>`}
/* ---------- views ---------- */
function curAct(v){const bs=v.blocks||[];return bs.includes(ACT[v.id])?ACT[v.id]:bs[0]}
function renderView(id){const v=VIEWDEF().find(x=>x.id==id)||VIEWDEF()[0];const box=$('#v-'+v.id);
 if(v.id=='inicio'){box.innerHTML=`<div class="phead end"><span class="pbtns">${enBtn()}${lisBtn()}</span></div>`+home();DIRTY.delete(v.id);return}
 if(v.id=='unidades'){box.innerHTML=`<div class="phead"><h2 class="ptitle">📚 Unidades</h2>${enBtn()}</div>${unitGrid()}`;DIRTY.delete(v.id);return}
 if(v.id=='practicar'){box.innerHTML=`<div class="phead"><h2 class="ptitle">🎯 Practicar</h2><span class="pbtns">${enBtn()}${lisBtn()}</span></div>${practiceGrid()}`;DIRTY.delete(v.id);return}
 const a=curAct(v);const multi=(v.blocks||[]).length>1;const n=v.u?ALL.filter(c=>c.u==v.u&&c.lvl==S.lvl).length:0;
 box.innerHTML=(multi||v.u?`<header class="vhead"><span class="vi" aria-hidden="true">${v.ic}</span><div><h2>${v.t}</h2><p><span class="en">${v.en} · </span>${v.u?`${LV[S.lvl]} · ${n} palabras${v.desc?' · '+v.desc:''}`:(v.desc||'')}</p></div></header>`:'')+`
 ${multi?`<div class="acts" role="tablist">${v.blocks.map(b=>`<button role="tab" data-act="${b}" data-v="${v.id}" aria-selected="${a==b}"><span>${TABIC[b]||''}</span>${BL[b].label||b}</button>`).join('')}</div>`:''}
 <div class="actbox">${blockHTML(a)}</div>`;
 post(a);DIRTY.delete(v.id)}
function fixTabIcons(v){$$(`#v-${v.id} .acts button`).forEach(bt=>{const b=bt.dataset.act;const ic=RUN[b]&&RUN[b].o&&RUN[b].o.icon;if(ic&&!bt.firstChild.textContent)bt.firstChild.textContent=ic})}
function switchAct(vid,b){ACT[vid]=b;saveAct();const v=VIEWDEF().find(x=>x.id==vid);$$(`#v-${vid} .acts button`).forEach(x=>x.setAttribute('aria-selected',x.dataset.act==b));const box=$(`#v-${vid} .actbox`);if(box){box.innerHTML=blockHTML(b);post(b)}}
function go(id,push=true){if(!VIEWDEF().some(v=>v.id==id))id='inicio';CUR=id;$$('.view').forEach(x=>x.hidden=x.id!='v-'+id);
 $$('[data-view]').forEach(b=>{if(b.closest('.side,.bnav'))b.setAttribute('aria-current',b.dataset.view==id||(id!='inicio'&&b.dataset.view=='unidades'&&VIEWS.some(v=>v.id==id))?'page':'false')});
 if(DIRTY.has(id)||!$('#v-'+id).innerHTML)renderView(id);if(id=='inicio'||id=='progreso')renderView(id);
 if(push&&location.hash!='#'+id){try{history.replaceState(null,'','#'+id)}catch(e){}}dueBadges()}
function dueBadges(){const n=dueList().length;$$('[data-due]').forEach(b=>{b.textContent=n||'';b.hidden=!n})}
function rerenderAll(){VIEWDEF().forEach(v=>DIRTY.add(v.id));renderView(CUR);$('#side').innerHTML=sideHTML();$('#mtop').innerHTML=mtopHTML();go(CUR,false)}
function applyS(){document.body.dataset.pal=S.pal;document.documentElement.style.setProperty('--fs',S.fs);document.body.classList.toggle('noen',!showEn());document.body.classList.toggle('nolisten',!!S.nolisten);
 $$('[data-set]').forEach(b=>b.setAttribute('aria-pressed',String(S[b.dataset.set])==b.dataset.v));$$('[data-tog]').forEach(b=>b.setAttribute('aria-pressed',!!S[b.dataset.tog]));
 const on=showEn();$$('[data-entog]').forEach(b=>{b.setAttribute('aria-pressed',on);const l=$('.enl',b);if(l)l.textContent=on?'Inglés: sí':'Inglés: no'});
 $$('input[data-en]').forEach(i=>{i.placeholder=i.dataset.ph0+(on?' · '+i.dataset.en:'')})}
/* ---------- home and hubs ---------- */
const unitPct=v=>{const ws=ALL.filter(c=>c.u==v.u&&c.lvl==S.lvl);return ws.length?Math.round(ws.filter(mastered).length/ws.length*100):0};
function unitGrid(){return `<div class="ugrid">${VIEWS.map(v=>{const p=unitPct(v);return `<button class="ucard" data-view="${v.id}"><span class="ui" aria-hidden="true">${v.ic}</span><b>${v.t}</b><small><span class="en">${v.en} · </span>${v.desc||''}</small><span class="pbar sm"><span class="pm" style="width:${p}%"></span></span><small>${p}% dominado ${tEn('mastered')}</small></button>`}).join('')}</div>`}
function practiceGrid(){const it=[['rev-today','🔁','Repaso de hoy',"Today's review"],['rev-new','✨','Palabras nuevas','New words'],...(S.nolisten?[]:[['rev-listen','🎧','¿Qué oyes?','Listening']]),['rev-gender','⚖️','¿El o la?','Articles'],['exam','📝','Examen','Practice test'],['fcards','🃏','Tarjetas','Flashcards'],['expr','💬','Expresiones','Idioms'],['wlist','📖','Lista de palabras','Word list']];
 return `<div class="pgrid">${it.map(([b,i,t,e])=>`<button class="pcard" data-act-go="${b}"><span>${i}</span><b>${t}</b><small class="en">${e}</small></button>`).join('')}</div>`}
function home(){const nm=S.name?`, ${esc(S.name)}`:'';const due=dueList().length,st=streak();
return `<section class="hello"><div class="hmain"><h2>¡Hola${nm}! 👋</h2><p class="hsub">${st?`🔥 ${st} ${st==1?'día':'días'} seguidos · `:''}⭐ <span class="starsn">${+store.get('stars')||0}</span> estrellas · Nivel ${LV[S.lvl]}</p>
<div class="ctas"><button class="cta pri" data-sess><span>⏱️</span><b>Mi sesión de 10 minutos</b><small>Repaso, un dibujo, palabras nuevas${S.nolisten?'':' y escuchar'}</small></button><button class="cta" data-act-go="rev-today"><span>🔁</span><b>Repaso de hoy</b><small>${due?`${due} palabras te esperan`:'¡Todo repasado!'}</small></button></div></div>
<div class="howl">${owl(150)}</div></section>
<h3 class="sec">Unidades ${tEn('units')}</h3>${unitGrid()}
<h3 class="sec">Practicar ${tEn('practice')}</h3>${practiceGrid()}`}
/* ---------- boot ---------- */
function boot(){
document.body.insertAdjacentHTML('afterbegin',`<div class="app"><aside class="side" id="side">${sideHTML()}</aside><div class="mainw"><header class="mtop" id="mtop">${mtopHTML()}</header><main id="main">${VIEWDEF().map(v=>`<div class="view" id="v-${v.id}" hidden></div>`).join('')}</main></div></div><nav class="bnav" id="bnav" aria-label="Menú">${bnavHTML()}</nav><div id="sessbar" class="sessbar" hidden></div><div class="modal" id="cfg" hidden></div>`);
applyS();
const openCfg=()=>{const m=$('#cfg');m.innerHTML=cfgHTML();m.hidden=false;applyS();const b=m.querySelector('[data-cfgclose]');if(b)b.focus()};
document.addEventListener('click',e=>{const t=e.target.closest('[data-entog],[data-set],[data-tog],[data-view],[data-cfg],[data-cfgclose],[data-act],[data-act-go],#cfg');if(!t)return;
 if(t.id=='cfg'){if(e.target.id=='cfg')$('#cfg').hidden=true;else return}
 if(t.dataset.cfg!=null){openCfg();return}if(t.dataset.cfgclose!=null){$('#cfg').hidden=true;return}
 if(t.dataset.actGo){const b=t.dataset.actGo,v=viewOfBlock(b);ACT[v]=b;saveAct();DIRTY.add(v);go(v);window.scrollTo({top:0});return}
 if(t.dataset.act&&t.dataset.v){switchAct(t.dataset.v,t.dataset.act);return}
 if(t.dataset.view){go(t.dataset.view);window.scrollTo({top:0});return}
 if(t.dataset.entog!=null){S.enMode=showEn()?'off':'on';saveS();applyS();if($('#cfg')&&!$('#cfg').hidden){$('#cfg').innerHTML=cfgHTML();applyS()}return}
 if(t.dataset.set){const k=t.dataset.set;let v=t.dataset.v;if(k=='lvl'||k=='fs')v=+v;S[k]=v;saveS();applyS();if(['lvl','dev','av','enMode'].includes(k)){FC.deck=[];rerenderAll()}if(!$('#cfg').hidden&&k=='lvl'){$('#cfg').innerHTML=cfgHTML();applyS()}return}
 if(t.dataset.tog){const k=t.dataset.tog;S[k]=!S[k];saveS();applyS();if(k=='bank')Object.keys(RUN).forEach(id=>{if($('#b-'+id))bank(id)});if(k=='art'||k=='nolisten')rerenderAll();return}});
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&!$('#cfg').hidden)$('#cfg').hidden=true});
document.addEventListener('change',e=>{if(e.target.id=='pname'){S.name=e.target.value.trim().slice(0,30);saveS();DIRTY.add('inicio');if(CUR=='inicio')renderView('inicio')}});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!=CUR)go(h,false)});
let wasPh=isPhone();addEventListener('resize',()=>{clearTimeout(window._rz);window._rz=setTimeout(()=>{if(isPhone()!=wasPh){wasPh=isPhone();rerenderAll()}},300)});
go(location.hash.slice(1)||'inicio',false)}

/* ==== init.js ==== */
/* init.js: exam pools from old data, then start */
SENT2.forEach(s=>{const c=entry(s[1]);if(c)addXS(c.u,[[s[0],s[1],s[2]||1]])});
POOLS.forEach(p=>{const c=entry(first(p[2]));if(c&&c.u!='Ropa')addXG(c.u,[[p[0],p[1],p[2],1]])});
boot();

</script>

</body></html>
